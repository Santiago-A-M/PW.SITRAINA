  <script>
    (function () {
      try {
        if (localStorage.getItem('modoOscuro') === 'true') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
      try {
        var nav = sessionStorage.getItem('sitrainaNav');
        if (nav && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var datoNav = JSON.parse(nav);
          document.documentElement.style.setProperty('--nav-desde-x', datoNav.dir === 'izquierda' ? '-100vw' : '100vw');
          document.documentElement.classList.add('nav-llegando');
        }
        if (nav) sessionStorage.removeItem('sitrainaNav');
      } catch (eNav) {}
      try {
        var pendiente = sessionStorage.getItem('sitrainaDoc');
        if (!pendiente) return;
        sessionStorage.removeItem('sitrainaDoc');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var dato = JSON.parse(pendiente);
        if (dato.dir) sessionStorage.setItem('sitrainaDocDir', dato.dir);
        var desde = dato.volver
          ? { derecha: ['100vw', '0px'], izquierda: ['-100vw', '0px'], abajo: ['0px', '100vh'], arriba: ['0px', '-100vh'] }
          : { derecha: ['-100vw', '0px'], izquierda: ['100vw', '0px'], abajo: ['0px', '-100vh'], arriba: ['0px', '100vh'] };
        var par = desde[dato.dir] || ['-100vw', '0px'];
        document.documentElement.style.setProperty('--doc-desde-x', par[0]);
        document.documentElement.style.setProperty('--doc-desde-y', par[1]);
        document.documentElement.classList.add('doc-llegando');
      } catch (e2) {}
    })();
  </script>
